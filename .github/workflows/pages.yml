name: Deploy sendoncue.com

# Publishes this repo to GitHub Pages at https://sendoncue.com
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# The custom domain comes from the CNAME file, so it survives every redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancelling it.
# Keyed by ref rather than a bare "pages", so a run that GitHub wedges cannot
# block every future deploy behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
